name: Build discuz-php

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # 每 6 小时轮询上游；只有「构建指纹」变了才真编译（见 check job）
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      php_versions:
        description: "强制指定精确版本（空格分隔），留空 = 自动解析 PHP_BRANCHES 各分支最新版"
        required: false
        default: ""
      force:
        description: "强制重建（忽略指纹缓存）"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 要跟踪的 PHP 分支（不是精确版本号！）。
  # check job 会查 Docker Hub，自动解析每个分支当前的**最新补丁版本**。
  # 上游一发新版（如 8.5.13），这里什么都不用改，CI 会自动构建。
  # 加一个分支就在这里加一项。
  PHP_BRANCHES: "7.4 8.4 8.5"
  # 各分支里"最新版"要打上 :latest 标签的那个
  LATEST_BRANCH: "8.5"
  REGISTRY: ghcr.io
  IMAGE_NAME: discuz-php

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================ 版本探测
  # 轻量 job：解析每个版本的「构建指纹」，决定哪些需要真编译
  check:
    name: 探测上游版本
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      summary: ${{ steps.resolve.outputs.summary }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: 解析版本与构建指纹
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          MANUAL: ${{ github.event.inputs.php_versions }}
          FORCE: ${{ github.event.inputs.force }}
          REPO_LC: ${{ github.repository }}
        run: |
          set -euo pipefail

          repo_lc=$(printf '%s' "$REPO_LC" | tr '[:upper:]' '[:lower:]')
          image="${REGISTRY}/${repo_lc%%/*}/${IMAGE_NAME}"

          # ---------- 解析各分支的最新补丁版本 ----------
          # 手动指定则直接用；否则查 Docker Hub 拿每个分支最新的 <branch>.<patch>-fpm-alpine。
          # 上游一发新版（8.5.13），这里解析结果就变，指纹随之变化 → 自动重编。
          if [ -n "$MANUAL" ]; then
            versions="$MANUAL"
            echo "::notice::使用手动指定的版本：$versions"
          else
            versions=""
            for br in $PHP_BRANCHES; do
              tag=$(curl -fsSL "https://hub.docker.com/v2/repositories/library/php/tags/?page_size=100&name=${br}." 2>/dev/null \
                | jq -r --arg br "$br" '
                    [ .results[].name | select(test("^" + $br + "\\.[0-9]+-fpm-alpine$")) ]
                    | sort_by(split("-")[0] | split(".") | map(tonumber))
                    | last // empty' 2>/dev/null || true)
              if [ -n "$tag" ] && [ "$tag" != "null" ]; then
                versions="$versions ${tag%-fpm-alpine}"
              else
                echo "::warning::无法解析分支 ${br} 的最新版本，跳过该分支"
              fi
            done
            versions="${versions# }"
            if [ -z "$versions" ]; then
              echo "::error::一个分支都没解析出来，检查 Docker Hub API 或 PHP_BRANCHES 配置"
              exit 1
            fi
            echo "::notice::解析到版本：$versions"
          fi

          # Dockerfile 本身也是构建输入，改了就要重编
          df_hash=$(sha256sum Dockerfile | cut -c1-12)

          # 指纹闸门只留给「定时探测」和 PR —— 那里才是烧额度的地方。
          # push / 手动触发总是构建（见 caddy 仓库同样的取舍）。
          gate=false
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "pull_request" ]; then
            gate=true
          fi
          if [ "$FORCE" = "true" ]; then gate=false; fi

          login_ok=false
          if printf '%s' "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin >/dev/null 2>&1; then
            login_ok=true
          fi

          matrix='[]'
          summary=""

          for v in $versions; do
            base="php:${v}-fpm-alpine"
            br="${v%.*}"   # 8.5.12 -> 8.5

            # 上游镜像 digest：上游一发新版，digest 变，指纹就变
            digest=$(docker buildx imagetools inspect "$base" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -z "$digest" ]; then
              echo "::warning::无法解析 ${base} 的 digest，跳过 ${v}"
              summary="${summary}| ${v} | 解析上游失败，跳过 | - |\n"
              continue
            fi

            fp=$(printf 'php=%s;digest=%s;dockerfile=%s' "$v" "$digest" "$df_hash" | sha256sum | cut -c1-12)
            fp_short=$(printf '%s' "$fp" | cut -c1-12)

            need=true
            reason="指纹 fp-${fp_short} 还没构建过"
            if [ "$gate" = "true" ] && [ "$login_ok" = "true" ]; then
              if docker buildx imagetools inspect "${image}:fp-${fp_short}" >/dev/null 2>&1; then
                need=false
                reason="指纹已存在，跳过"
              fi
            elif [ "$gate" = "false" ]; then
              reason="手动/push 触发，总是构建"
            else
              reason="登录 GHCR 失败，保守起见构建"
            fi

            summary="${summary}| ${v} | ${reason} | \`fp-${fp_short}\` |\n"

            if [ "$need" = "true" ]; then
              matrix=$(printf '%s' "$matrix" | jq -c \
                --arg v "$v" --arg fp "$fp_short" --arg br "$br" \
                '. + [{"php": $v, "branch": $br, "fingerprint": $fp}]')
            fi
          done

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

          {
            echo "### 构建输入"
            echo ""
            echo "- Dockerfile 哈希：\`${df_hash}\`"
            echo "- 目标版本：\`${versions}\`"
            echo ""
            echo "| PHP | 决定 | 指纹 |"
            echo "|---|---|---|"
            printf '%b' "$summary"
            echo ""
            echo "待构建：\`$(printf '%s' "$matrix" | jq -c '[.[].php]')\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::待构建版本：$(printf '%s' "$matrix" | jq -c '[.[].php]')"

  # ============================================================ 镜像
  image:
    name: 镜像 php-${{ matrix.php }}
    needs: check
    if: needs.check.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名
        id: img
        env:
          REPO_LC: ${{ github.repository }}
        run: |
          repo_lc=$(printf '%s' "$REPO_LC" | tr '[:upper:]' '[:lower:]')
          echo "name=${REGISTRY}/${repo_lc%%/*}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=php-${{ matrix.php }}
            type=raw,value=php-${{ matrix.branch }}
            type=raw,value=fp-${{ matrix.fingerprint }}
            type=raw,value=latest,enable=${{ matrix.branch == env.LATEST_BRANCH && github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            FINGERPRINT=${{ matrix.fingerprint }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
          # 缓存键天然跟着版本走：PHP_VERSION 和 FINGERPRINT 都出现在构建里，
          # 上游一发新版指纹就变、缓存失效，所以这里可以放心开缓存。
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}

      # ── 导出镜像归档（供 Release 下载，绕过慢速 docker pull）──
      # 多架构 manifest list 没法直接 docker save，所以按架构单独构建一份。
      # 复用上面的 buildx 缓存，第二次构建几乎不花时间。
      - name: 导出各架构镜像归档
        env:
          REPO_LC: ${{ github.repository }}
        run: |
          set -eux
          repo_lc=$(printf '%s' "$REPO_LC" | tr '[:upper:]' '[:lower:]')
          image="${REGISTRY}/${repo_lc%%/*}/${IMAGE_NAME}"
          ver="${{ matrix.php }}"

          for arch in amd64 arm64; do
            out="discuz-php_${ver}_linux_${arch}.tar"
            docker buildx build \
              --platform "linux/${arch}" \
              --build-arg "PHP_VERSION=${ver}" \
              --build-arg "FINGERPRINT=${{ matrix.fingerprint }}" \
              --build-arg "REPO_URL=${{ github.server_url }}/${{ github.repository }}" \
              --tag "${image}:php-${ver}" \
              --output "type=docker,dest=${out}" \
              --cache-from "type=gha,scope=php-${ver}" \
              .
            gzip -9 "$out"
            sha256sum "${out}.gz" > "${out}.gz.sha256"
          done

          ls -lh discuz-php_*.tar.gz*

      - name: 上传归档
        uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.php }}
          path: discuz-php_*.tar.gz*
          retention-days: 7
          if-no-files-found: error

  # ============================================================ Release
  # 把各版本的镜像归档挂到 GitHub Release。
  # 用途：docker pull 慢的时候，直接下载 tar.gz → docker load，绕过 registry。
  release:
    name: 创建 Release
    needs: [check, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 下载所有归档
        uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          merge-multiple: true
          path: dist

      - name: 创建/更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.check.outputs.matrix }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
        run: |
          set -eux
          ls -lh dist/

          image_lc=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')

          for ver in $(printf '%s' "$MATRIX" | jq -r '.[].php'); do
            tag="php-${ver}"

            # 用 echo 逐行拼，避免 heredoc 里反引号被当成命令替换
            {
              echo "PHP ${ver} 的 PHP-FPM 镜像（Discuz! X3.5 用，已预装 gd / mysqli / pdo_mysql / zip / bcmath）。"
              echo
              echo "## 用法一：拉取镜像（推荐）"
              echo
              echo '```'
              echo "docker pull ${image_lc}:php-${ver}"
              echo '```'
              echo
              echo "## 用法二：下载归档（docker pull 慢时用）"
              echo
              echo "下载 \`discuz-php_${ver}_linux_amd64.tar.gz\` 和同名的 \`.sha256\`，然后："
              echo
              echo '```'
              echo "sha256sum -c discuz-php_${ver}_linux_amd64.tar.gz.sha256"
              echo "gunzip -c discuz-php_${ver}_linux_amd64.tar.gz | docker load"
              echo '```'
              echo
              echo "加载出来的镜像名与 GHCR 上完全一致（\`${image_lc}:php-${ver}\`），compose 里的 \`image:\` 不用改。"
              echo
              echo "arm64 把文件名里的 \`amd64\` 换掉即可。"
              echo
              echo "## 构建信息"
              echo
              echo "- 构建日志：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- 本次提交：\`${GITHUB_SHA:0:7}\`"
            } > notes.md

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "PHP ${ver}" --notes-file notes.md
            else
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --title "PHP ${ver}" --notes-file notes.md
            fi

            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/discuz-php_${ver}_linux_amd64.tar.gz \
              dist/discuz-php_${ver}_linux_amd64.tar.gz.sha256 \
              dist/discuz-php_${ver}_linux_arm64.tar.gz \
              dist/discuz-php_${ver}_linux_arm64.tar.gz.sha256
          done

  # ============================================================ 保活
  # GitHub 会在仓库「60 天无活动」后自动停用定时工作流。
  # 本 job 每 ~50 天写一次 .keepalive，让仓库保持活跃，cron 不会断。
  #
  # 提交信息带 [skip ci]，所以不会反过来触发构建。
  # 只在 schedule 触发时运行 —— 手动触发/push 说明仓库本来就活跃。
  keepalive:
    name: 保活
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 距上次保活超过 50 天就写一次
        run: |
          set -eux
          last=$(git log -1 --format=%ct -- .keepalive 2>/dev/null || echo 0)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "距上次保活提交：${days} 天"

          if [ "$days" -lt 50 ]; then
            echo "::notice::还没到 50 天，跳过"
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git commit -m 'chore: 保活提交，防止定时工作流被 GitHub 停用 [skip ci]'
          git push
          echo "::notice::已提交保活，仓库活跃状态已刷新"
